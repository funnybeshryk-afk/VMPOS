name: Release

# Reliz: `git tag v1.0.1 && git push origin v1.0.1` (teg APP_VERSION bilan
# bir xil bo'lishi shart — app/version.py). Workflow testlarni o'tkazadi,
# .exe va o'rnatuvchini yig'adi, smoke-test qiladi va GitHub Release
# yaratadi. Dasturdagi avto-yangilash aynan shu relizdan o'qiydi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.11,<7"

      - name: Teg APP_VERSION bilan mosligini tekshirish
        run: |
          python -c "import os,sys; from app.version import APP_VERSION; tag=os.environ['GITHUB_REF_NAME'].lstrip('vV'); print('tag', tag, 'APP_VERSION', APP_VERSION); sys.exit(0 if tag==APP_VERSION else 'Teg va app/version.py mos emas')"

      - name: Testlar
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: .exe yig'ish
        run: powershell -File packaging\build_windows.ps1

      - name: Yig'ilgan .exe smoke-testi
        env:
          VMPOS_DATA_DIR: ${{ runner.temp }}\vmpos-smoke
        run: |
          $p = Start-Process -FilePath "dist\VMPOS\VMPOS.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke-test yiqildi, exit code $($p.ExitCode)" }

      - name: O'rnatuvchini yig'ish (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v","V")
          & $iscc "/DAppVersion=$version" installer\vmpos.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC xato bilan tugadi" }

      - name: SHA-256 yig'indisi
        run: |
          $file = Get-ChildItem dist-installer\VMPOS-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii "$($file.FullName).sha256"
          Write-Host "$hash  $($file.Name)"

      - name: Reliz yaratish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path release-notes.md)) { throw "release-notes.md topilmadi" }
          # PowerShell native buyruqqa "*" ni ochib bermaydi — fayllarni o'zimiz yig'amiz.
          $files = @(Get-ChildItem dist-installer -File | Where-Object { $_.Name -like "VMPOS-Setup-*" } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw "Kutilgan 2 fayl (exe + sha256), topildi: $($files.Count)" }
          gh release create "$env:GITHUB_REF_NAME" @files --title "VMPOS $env:GITHUB_REF_NAME" --notes-file release-notes.md
